# Голосовой вопрос (kbagent/voice.py): spoken — текст так, как его выдаёт распознавание речи (числа цифрами,
# единицы и обозначения моделей — словами, как их произносят); question — что получается после приведения к языку
# справочника. Вопросы к справочнику проверяются программой без модели — tests/test_eval_sets.py, в каждом прогоне
# тестов; документные — на компьютере с моделями:
#   python eval/run_eval.py --questions eval/voice.yaml --out voice --role "Техпродажи и сервис"
questions:
  - id: V01
    group: подбор
    type: doc
    spoken: подбери осциллограф с полосой не менее 150 мегагерц и четырьмя каналами
    question: Подбери осциллограф с полосой не менее 150 МГц и четырьмя каналами
    must_include: ["АКИП-4143/1", "Подходят: 6"]
    source: {doc: osc_akip_4143}
  - id: V02
    group: проверка требования
    type: doc
    spoken: можно ли мультиметром мас 830 л измерить ток 15 ампер
    question: Можно ли мультиметром MAS830L измерить ток 15 А
    must_include: ["не подходит", "10 А"]
    source: {doc: multimeter_mas830l}
  - id: V03
    group: значение
    type: doc
    spoken: какая частота дискретизации у акип 4115 1В
    question: Какая частота дискретизации у АКИП-4115/1В
    must_include: ["1 Гвыб/с"]
    source: {doc: osc_akip_4115v}
  - id: V04
    group: проверка требования
    type: doc
    spoken: подойдёт ли паяльная станция сбк 936 б для пайки при 450 градусов
    question: Подойдёт ли паяльная станция SBK936B для пайки при 450 °C
    must_include: ["подходит", "200–480"]
    source: {doc: solder_sbk936b}
  - id: V05
    group: подбор
    type: doc
    spoken: нужен осциллограф на два канала от 100 мегагерц
    question: Нужен осциллограф на два канала от 100 МГц
    must_include: ["Подходят: 18"]
    source: {doc: osc_akip_4115v}
  - id: V06
    group: сравнение
    type: doc
    spoken: сравни дт 9205 а и дт 9208 а
    question: Сравни DT9205A и DT9208A
    must_include: ["DT9205A", "DT9208A"]
    source: {doc: multimeter_tdm}
  # --- документы: ответ составляет модель, прогон — на компьютере с моделями ---
  - id: V07
    group: документы
    type: doc
    spoken: что делать при отказе оборудования категории б в ночную смену
    question: Что делать при отказе оборудования категории б в ночную смену
    must_include: ["2215", "начальник смены"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya, clause: "7.2"}
  - id: V08
    group: документы
    type: doc
    spoken: какой срок входного контроля для электрорадиоизделий
    question: Какой срок входного контроля для электрорадиоизделий
    must_include: ["5 рабочих дней"]
    source: {doc: STP-DP-01_vkhodnoj_kontrol, clause: "3.2"}
