    must_include: ["Acquire|СборИнф"]                      # меню Acquire → XY Mode (с. 27), а не DISPLAY
    source: {doc: osc_akip_4143}
  - id: F12
    group: справочник
    type: doc
    role: Техпродажи и сервис
    question: Чем отличается АКИП-4143/1 от АКИП-4143/2А?
    must_include: ["2 ГГц", "3 ГГц"]
    source: {doc: osc_akip_4143}
  - id: F13
