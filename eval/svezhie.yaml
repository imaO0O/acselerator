# Свежие вопросы (26.10.2026): заданы агенту впервые при критической проверке — их не было ни в одном наборе,
# под них агент не настраивался. Первый прогон — 19 из 28 (при 100 % на остальных наборах). Ошибки исправлены
# общими правилами в коде, без правки подсказок модели (Э13 в docs/dorabotki.md): 26 из 28 (видеокарта 12 ГБ),
# 27 из 28 (режим ноутбука -SmallGpu, 31.10). F11 и F25 — честный отказ вместо неверного ответа: нужный фрагмент
# найден, но модель на него не опирается — открытая задача.
# Набор показывает, обобщаются ли исправления, поэтому новые вопросы сюда добавляются, а не подгоняются.
#   python eval/run_eval.py --questions eval/svezhie.yaml --out svezhie
#   type: price — ответ о цене или наличии из прайса (или 1С), без языковой модели
questions:
  - id: F01
    group: справочник → документы
    type: doc
    role: Инженер производства
    question: Какое максимальное входное напряжение у мультиметра Юпитер 830B?
    must_include: ["1000 В"]
    source: {doc: multimeter_jupiter_830b}
  - id: F02
    group: руководства
    type: doc
    role: Инженер производства
    question: Как заменить батарейку в мультиметре MAS830L?
    must_include: ["винт"]
    source: {doc: multimeter_mas830l}
  - id: F03
    group: справочник
    type: doc
    role: Техпродажи и сервис
    question: Какая максимальная температура у паяльной станции Магистр Ц20-ДВ?
    must_include: ["350"]
    source: {doc: solder_magistr_c20}
  - id: F04
    group: ловушки
    type: none
    role: Инженер производства
    question: Что значит ошибка S-E на паяльной станции Lukey 852D+?
  - id: F05
    group: стандарты
    type: doc
    question: Какой минимальный размер шрифта в текстовом документе по ГОСТ 2.105?
    must_include: ["14"]
    source: {doc: gost_r_2_105_2019}
  - id: F06
    group: охрана труда
    type: doc
    role: Инженер производства
    question: Кто имеет право выдавать наряд-допуск на работы в электроустановках?
    must_include: ["административно-технического"]
    source: {doc: ot_electro_903n}
  - id: F07
    group: охрана труда
    type: doc
    role: Инженер производства
    question: Как часто нужно проверять ручной электроинструмент?
    must_include: ["6 месяцев"]
    source: {doc: ot_instrument_835n}
  - id: F08
    group: ловушки
    type: doc
    role: Инженер производства
    question: Сколько хранятся записи входного контроля?     # срока в регламенте нет; «сколько» — не счётчик учёта
    must_include: ["не указан"]                            # п. 4.7 — куда заносятся результаты, срока хранения нет
    source: {doc: STP-DP-01_vkhodnoj_kontrol}
  - id: F09
    group: регламенты
    type: doc
    role: Инженер производства
    question: Как хранить микросхемы, чувствительные к статическому электричеству?
    must_include: ["антистатическ"]
    source: {doc: RI-DP-03_khranenie_eri}
  - id: F10
    group: регламенты
    type: doc
    role: Инженер производства
    question: Кому звонить, если станок сломался в ночную смену?
    must_include: ["2215"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya}
  - id: F11
    group: руководства
    type: doc
    role: Техпродажи и сервис
