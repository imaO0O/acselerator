# Письма клиентов → черновик ТКП (kbagent/tkp.py): разбор на позиции, количество и требования, подбор по справочнику
# параметров программой, вопросы клиенту, продукция вне справочника, противоречия — эксперту.
# Ответ засчитывается, если в тексте разбора есть предложенные модели и количества и процитированы верные руководства.
#   python eval/run_eval.py --questions eval/tkp.yaml --out tkp
questions:
  - id: K01
    group: основной
    type: doc
    role: Техпродажи и сервис
    question: "Подготовь ТКП по письму клиента: «Просим предложить 2 осциллографа с полосой не менее 150 МГц и 4 каналами, мультиметр для измерения тока до 15 А — 3 шт., паяльную станцию для пайки при 450 °C и источник питания 30 В»"
    must_include: ["Разбор запроса клиента", "Осциллограф — 2 шт", "АКИП-4143/1", "Мультиметр — 3 шт", "DT9205A",
                   "CXG DES H95", "Источник питания", "нет в справочнике"]
    source: {doc: [osc_akip_4143, multimeter_tdm, solder_cxg_h95]}
  - id: K02
    group: основной
    type: doc
    role: Техпродажи и сервис
    question: |
      Добрый день!
      Нашему сервисному участку нужны:
      — 4 цифровых мультиметра для измерения переменного напряжения до 700 В;
      — осциллограф АКИП-4115/2В — 1 шт.
      Просьба выставить коммерческое предложение.
      С уважением, инженер ООО «Пример»
    must_include: ["Мультиметр — 4 шт", "переменное напряжение", "DT9205A", "Осциллограф — 1 шт", "АКИП-4115/2В",
                   "200 МГц"]
    must_exclude: ["MAS830L"]
    source: {doc: [multimeter_tdm, osc_akip_4115v]}
  - id: K03
    group: не подходит
    type: doc
    role: Техпродажи и сервис
    question: "Просим КП: мультиметр для измерения постоянного тока до 30 А — 2 шт., паяльная станция с паяльником мощностью от 100 Вт"
    must_include: ["ни одна модель", "20 А", "30 А", "90 Вт", "Уточнить у клиента"]
    must_exclude: ["Предлагаем"]
    source: {doc: [multimeter_tdm, solder_cxg_h95, solder_magistr_c20]}
  - id: K04
    group: без требований
    type: doc
    role: Техпродажи и сервис
    question: "Подготовьте ТКП на осциллограф и две паяльные станции"
    must_include: ["Осциллограф — 1 шт", "Паяльная станция — 2 шт", "Уточнить у клиента", "полоса пропускания",
                   "температура пайки"]
    must_exclude: ["Предлагаем"]
  - id: K05
    group: противоречие
    type: doc
    role: Техпродажи и сервис
    question: "ТКП: осциллограф АКИП-4115/1В с частотой дискретизации от 1 Гвыб/с — 2 шт."
    must_include: ["Осциллограф — 2 шт", "АКИП-4115/1В", "проверка эксперта", "переданы эксперту"]
    must_exclude: ["Предлагаем"]
    source: {doc: osc_akip_4115v}
  - id: K06
    group: модели названы
    type: doc
    role: Техпродажи и сервис
    question: "Нужны 3 паяльные станции Lukey 852D+ и 2 мультиметра MAS830L, подготовьте предложение"
    must_include: ["Паяльная станция — 3 шт", "Lukey 852D+", "Мультиметр — 2 шт", "MAS830L"]
    source: {doc: [solder_lukey_852, multimeter_mas830l]}
  - id: K07
    group: подбор
    type: doc
    role: Техпродажи и сервис
    question: "Добрый день! Меня зовут Иван, телефон +7 912 345-67-89. Нужен осциллограф на 4 канала с полосой от 1 ГГц и мультиметр с измерением сопротивления до 200 МОм. Пришлите коммерческое предложение."
    must_include: ["АКИП-4143/1", "сопротивление"]
    must_exclude: ["912"]
    source: {doc: osc_akip_4143}
  - id: K08
    group: нет в справочнике
    type: none
    role: Техпродажи и сервис
    question: "Подготовьте ТКП на лабораторный источник питания 30 В 5 А и генератор сигналов"
  # K09–K20 — Д1: формулировки требований, единицы латиницей, опечатки, таблица из Word, прайс, персональные данные
  - id: K09
    group: формулировки
    type: doc
    role: Техпродажи и сервис
    question: "Прошу КП на осциллограф с полосой пропускания не хуже 200 МГц, 2 канала — 1 шт."
    must_include: ["Осциллограф — 1 шт", "полоса пропускания не менее 200 МГц", "АКИП-4115/2В", "46 500 ₽"]
    source: {doc: osc_akip_4115v}
  - id: K10
    group: формулировки
    type: doc
    role: Техпродажи и сервис
    question: "Коммерческое предложение: осциллограф, полоса ≥ 100 МГц, каналов ≥ 4 — 3 шт."
    must_include: ["Осциллограф — 3 шт", "число каналов не менее 4", "АКИП-4143/1", "567 000 ₽"]
    must_exclude: ["АКИП-4115/1В"]
    source: {doc: osc_akip_4143}
  - id: K11
    group: формулировки
    type: doc
    role: Техпродажи и сервис
    question: "Просим предложить паяльную станцию с регулировкой температуры от 200 до 480 °C — 5 шт."
    must_include: ["Паяльная станция — 5 шт", "от 200 до 480 °C", "CXG DES H95", "39 000 ₽"]
    source: {doc: solder_cxg_h95}
  - id: K12
    group: единицы латиницей
    type: doc
    role: Техпродажи и сервис
    question: "Прошу КП: осциллограф 4 канала, полоса 350 MHz; мультиметр, постоянный ток до 10 A — 2 шт.; паяльная станция мощностью от 60 W"
    must_include: ["полоса пропускания не менее 350 МГц", "АКИП-4143/1", "Мультиметр — 2 шт", "10 А", "MAS830L",
                   "мощность паяльника не менее 60 Вт", "CXG DES H95"]
    must_exclude: ["Уточнить у клиента"]
    source: {doc: [osc_akip_4143, multimeter_mas830l, solder_cxg_h95]}
  - id: K13
    group: опечатки
    type: doc
    role: Техпродажи и сервис
    question: "Здраствуйте! Нужны осцилографы 2 штуки с полосой от 100 МГЦ и мультиметер на ток 20 А. Пришлите КП"
    must_include: ["Осциллограф — 2 шт", "полоса пропускания не менее 100 МГц", "АКИП-4115/1В", "DT9205A"]
    source: {doc: [osc_akip_4115v, multimeter_tdm]}
  - id: K14
    group: таблица
    type: doc
    role: Техпродажи и сервис
    question: |
      Добрый день! Просим КП по таблице:
      Наименование | Требования | Кол-во
      Осциллограф | полоса от 200 МГц, 4 канала | 1
      Мультиметр | переменное напряжение до 750 В | 5
    must_include: ["Осциллограф — 1 шт", "АКИП-4143/1", "Мультиметр — 5 шт", "DT9205A", "1 450 ₽ × 5 шт. = 7 250 ₽"]
    source: {doc: [osc_akip_4143, multimeter_tdm]}
  - id: K15
    group: прайс
    type: doc
    role: Техпродажи и сервис
    question: "Пришлите КП с ценами: 2 мультиметра DT9205A и паяльная станция Lukey 852D+"
    must_include: ["Мультиметр — 2 шт", "DT9205A", "1 450 ₽ × 2 шт. = 2 900 ₽", "Lukey 852D+", "по прайсу",
                   "Итого по прайсу", "9 200 ₽"]
    source: {doc: [multimeter_tdm, solder_lukey_852]}
  - id: K16
    group: прайс
    type: doc
    role: Техпродажи и сервис
    question: "КП на мультиметр Юпитер 830B — 10 шт."
    must_include: ["Мультиметр — 10 шт", "Юпитер 830B", "В прайсе цены нет"]
    must_exclude: ["Итого по прайсу"]
    source: {doc: multimeter_jupiter_830b}
  - id: K17
    group: модели названы
    type: doc
    role: Техпродажи и сервис
    question: "Подготовьте ТКП: три осциллографа АКИП-4122/1(V) и четыре мультиметра MAS830L"
    must_include: ["Осциллограф — 3 шт", "АКИП-4122/1(V)", "Мультиметр — 4 шт", "MAS830L", "158 400 ₽", "3 560 ₽"]
    source: {doc: [osc_portable, multimeter_mas830l]}
  - id: K18
    group: формулировки
    type: doc
    role: Техпродажи и сервис
    question: "Нужен осциллограф со временем нарастания не более 1 нс, 2 шт. Просим КП."
    must_include: ["Осциллограф — 2 шт", "время нарастания не более 1 нс", "АКИП-4143/1", "180 пс"]
    source: {doc: osc_akip_4143}
  - id: K19
    group: персональные данные
    type: doc
    role: Техпродажи и сервис
    question: |
      Добрый день! Просим КП на 2 паяльные станции до 480 °C.
      С уважением, Петров Пётр Петрович, тел. 8 (4912) 55-12-34, petrov@zavod.ru, ИНН 6234000000
    must_include: ["Паяльная станция — 2 шт", "CXG DES H95", "15 600 ₽"]
    must_exclude: ["55-12-34", "petrov@", "6234000000"]
    source: {doc: solder_cxg_h95}
  - id: K20
    group: нет в справочнике
    type: doc
    role: Техпродажи и сервис
    question: "ТКП: осциллограф с полосой от 0,5 ГГц — 1 шт., частотомер до 3 ГГц — 1 шт."
    must_include: ["полоса пропускания не менее 0,5 ГГц", "АКИП-4143/1", "Частотомер", "нет в справочнике"]
    source: {doc: osc_akip_4143}
