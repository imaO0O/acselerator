# Письма клиентов → черновик ТКП (kbagent/tkp.py): разбор на позиции, количество и требования, подбор по справочнику
# параметров программой, вопросы клиенту, продукция вне справочника, противоречия — эксперту.
# Ответ засчитывается, если в тексте разбора есть предложенные модели и количества и процитированы верные руководства.
# file — письмо приложено файлом, как скрепкой в чате (.eml, PDF, Word): eval/letters, пересоздаются
# python eval/letters/make_letters.py
#   python eval/run_eval.py --questions eval/tkp.yaml --out tkp
questions:
  - id: K01
    group: основной
    type: doc
    role: Техпродажи и сервис
    question: "Подготовь ТКП по письму клиента: «Просим предложить 2 осциллографа с полосой не менее 150 МГц и 4 каналами, мультиметр для измерения тока до 15 А — 3 шт., паяльную станцию для пайки при 450 °C и источник питания 30 В»"
    must_include: ["Разбор запроса клиента", "Осциллограф — 2 шт", "АКИП-4143/1", "Мультиметр — 3 шт", "DT9205A",
                   "CXG DES H95", "Источник питания", "нет в справочнике"]
    source: {doc: [osc_akip_4143, multimeter_tdm, solder_cxg_h95]}
  - id: K02
    group: основной
    type: doc
    role: Техпродажи и сервис
    question: |
      Добрый день!
      Нашему сервисному участку нужны:
      — 4 цифровых мультиметра для измерения переменного напряжения до 700 В;
      — осциллограф АКИП-4115/2В — 1 шт.
      Просьба выставить коммерческое предложение.
      С уважением, инженер ООО «Пример»
    must_include: ["Мультиметр — 4 шт", "переменное напряжение", "DT9205A", "Осциллограф — 1 шт", "АКИП-4115/2В",
                   "200 МГц"]
    must_exclude: ["MAS830L"]
    source: {doc: [multimeter_tdm, osc_akip_4115v]}
  - id: K03
    group: не подходит
    type: doc
    role: Техпродажи и сервис
    question: "Просим КП: мультиметр для измерения постоянного тока до 30 А — 2 шт., паяльная станция с паяльником мощностью от 100 Вт"
    must_include: ["ни одна модель", "20 А", "30 А", "90 Вт", "Уточнить у клиента"]
    must_exclude: ["Предлагаем"]
    source: {doc: [multimeter_tdm, solder_cxg_h95, solder_magistr_c20]}
  - id: K04
    group: без требований
    type: doc
    role: Техпродажи и сервис
    question: "Подготовьте ТКП на осциллограф и две паяльные станции"
    must_include: ["Осциллограф — 1 шт", "Паяльная станция — 2 шт", "Уточнить у клиента", "полоса пропускания",
                   "температура пайки"]
    must_exclude: ["Предлагаем"]
  - id: K05
    group: противоречие
    type: doc
    role: Техпродажи и сервис
    question: "ТКП: осциллограф АКИП-4115/1В с частотой дискретизации от 1 Гвыб/с — 2 шт."
    must_include: ["Осциллограф — 2 шт", "АКИП-4115/1В", "проверка эксперта", "переданы эксперту"]
    must_exclude: ["Предлагаем"]
    source: {doc: osc_akip_4115v}
  - id: K06
    group: модели названы
    type: doc
    role: Техпродажи и сервис
    question: "Нужны 3 паяльные станции Lukey 852D+ и 2 мультиметра MAS830L, подготовьте предложение"
    must_include: ["Паяльная станция — 3 шт", "Lukey 852D+", "Мультиметр — 2 шт", "MAS830L"]
    source: {doc: [solder_lukey_852, multimeter_mas830l]}
  - id: K07
    group: подбор
    type: doc
    role: Техпродажи и сервис
    question: "Добрый день! Меня зовут Иван, телефон +7 912 345-67-89. Нужен осциллограф на 4 канала с полосой от 1 ГГц и мультиметр с измерением сопротивления до 200 МОм. Пришлите коммерческое предложение."
    must_include: ["АКИП-4143/1", "сопротивление"]
    must_exclude: ["912"]
    source: {doc: osc_akip_4143}
  - id: K08
    group: нет в справочнике
    type: none
    role: Техпродажи и сервис
    question: "Подготовьте ТКП на лабораторный источник питания 30 В 5 А и генератор сигналов"
  # Д1 (участник 2): формулировки писем — «не хуже», «≥», «от … до», латиница, опечатки, таблица, файлы .eml / PDF / Word
  - id: K09
    group: не хуже
    type: doc
    role: Техпродажи и сервис
    question: "Добрый день! Просим КП на осциллограф: полоса пропускания не хуже 200 МГц, 2 канала, 3 шт."
    must_include: ["Осциллограф — 3 шт", "не менее 200 МГц", "АКИП-4115/2В"]
    source: {doc: osc_akip_4115v}
  - id: K10
    group: знаки ≥ ≤
    type: doc
    role: Техпродажи и сервис
    question: "Запрос КП. Мультиметр — 2 шт.: постоянный ток ≥ 15 А, сопротивление ≥ 100 МОм."
    must_include: ["Мультиметр — 2 шт", "DT9205A", "200 МОм", "Других подходящих нет"]
    source: {doc: multimeter_tdm}
  - id: K11
    group: от … до
    type: doc
    role: Техпродажи и сервис
    question: "Нужна паяльная станция с регулировкой температуры жала от 100 до 450 °C. Просим коммерческое предложение."
    must_include: ["от 100 °C", "до 450 °C", "CXG DES H95", "Других подходящих нет"]
    must_exclude: ["Lukey 852D+", "SBK936B"]
    source: {doc: solder_cxg_h95}
  - id: K12
    group: латиница
    type: doc
    role: Техпродажи и сервис
    question: "Просим КП: осциллограф 4 канала, bandwidth 1 GHz; мультиметр DC 15 A — 2 шт.; паяльная станция с паяльником 90 W."
    must_include: ["не менее 1 ГГц", "АКИП-4143/1", "Мультиметр — 2 шт", "постоянный ток", "DT9205A", "90 Вт",
                   "CXG DES H95"]
    source: {doc: [osc_akip_4143, multimeter_tdm, solder_cxg_h95]}
  - id: K13
    group: опечатки
    type: doc
    role: Техпродажи и сервис
    question: "Здраствуйте! Просим комерческое предложение: осцилограф с полосой от 150 МГц на 4 канала, мультимер для измерения тока до 15 А, паяльная станцыя до 450 С."
    must_include: ["позиций — 3", "АКИП-4143/1", "DT9205A", "до 450 °C", "CXG DES H95"]
    source: {doc: [osc_akip_4143, multimeter_tdm, solder_cxg_h95]}
  - id: K14
    group: таблица
    type: doc
    role: Техпродажи и сервис
    # таблица, вставленная из Word, — ячейки через табуляцию; количество — в последней колонке
    question: "Просим подготовить ТКП по позициям:\n№\tНаименование\tХарактеристики\tКол-во\n1\tОсциллограф\tполоса не менее 100 МГц, 2 канала\t2\n2\tМультиметр\tпостоянное напряжение до 1000 В\t5\n3\tПаяльная станция\tтемпература до 480 °C, с феном\t1"
    must_include: ["позиций — 3", "Осциллограф — 2 шт", "Мультиметр — 5 шт", "DT9205A", "Паяльная станция — 1 шт",
                   "наличие фена"]
    source: {doc: multimeter_tdm}
  - id: K15
    group: письмо .eml
    type: doc
    role: Техпродажи и сервис
    file: eval/letters/K15_zapros.eml
    must_include: ["позиций — 2", "Осциллограф — 2 шт", "АКИП-4122/12(V)", "Также подходят", "Мультиметр — 3 шт",
                   "MAS830L не подходит", "предлагаем аналог", "DT9205A"]
    must_exclude: ["111-22-33"]
    source: {doc: [osc_akip_4122, multimeter_tdm]}
  - id: K16
    group: письмо PDF
    type: doc
    role: Техпродажи и сервис
    file: eval/letters/K16_zapros.pdf
    must_include: ["Паяльная станция — 2 шт", "наличие фена", "Мультиметр — 2 шт", "DT9205A"]
    must_exclude: ["20-30-40"]
    source: {doc: multimeter_tdm}
  - id: K17
    group: таблица в Word
    type: doc
    role: Техпродажи и сервис
    file: eval/letters/K17_zapros.docx
    must_include: ["позиций — 3", "Осциллограф — 2 шт", "АКИП-4122/3(V)", "Мультиметр — 4 шт", "Юпитер 830B",
                   "Паяльная станция — 1 шт", "CXG DES H95"]
    must_exclude: ["765-43-21"]
    source: {doc: [osc_akip_4122, multimeter_jupiter_830b, solder_cxg_h95]}
  - id: K18
    group: количество
    type: doc
    role: Техпродажи и сервис
    question: "Коммерческое предложение на: осциллограф с полосой от 300 МГц в количестве 2 (двух) штук; мультиметр с сопротивлением до 200 МОм — 10 ед.; паяльная станция с феном — 3 комплекта."
    must_include: ["Осциллограф — 2 шт", "АКИП-4122/5(V)", "Мультиметр — 10 шт", "DT9205A", "Паяльная станция — 3 шт",
                   "наличие фена"]
    source: {doc: [osc_akip_4122, multimeter_tdm]}
  - id: K19
    group: цена и срок
    type: doc
    role: Техпродажи и сервис
    question: "Прошу направить цену и срок поставки: осциллограф АКИП-4122/12(V) — 1 шт., мультиметр DT9208A — 2 шт."
    must_include: ["Осциллограф — 1 шт", "АКИП-4122/12(V)", "Мультиметр — 2 шт", "DT9208A", "за менеджером"]
    source: {doc: [osc_akip_4122, multimeter_tdm]}
  - id: K20
    group: подпись
    type: doc
    role: Техпродажи и сервис
    question: "Добрый день! Просим КП на 4-канальный осциллограф со временем нарастания не более 200 пс и мультиметр массой ≤ 200 г для измерения переменного напряжения до 750 В.\nС уважением, Петрова Анна Сергеевна, тел. 8 (4912) 55-66-77"
    must_include: ["не более 200 пс", "АКИП-4143/1", "не более 200 г", "Юпитер 830B"]
    must_exclude: ["55-66-77", "Петрова"]
    source: {doc: [osc_akip_4143, multimeter_jupiter_830b]}
