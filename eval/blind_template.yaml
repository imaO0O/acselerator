# Шаблон «слепого» набора вопросов — для участников 2 и 3.
#
# Зачем: цифры на eval/questions.yaml получены на вопросах, по которым шла отладка агента,
# поэтому они завышены. Слепой набор пишут люди, которые не участвовали в отладке, и
# разработчик не видит его до прогона. Это честная проверка, которую можно показать жюри.
#
# Как составить (20–30 вопросов, примерно 1–1,5 часа):
#   1. Скопируйте файл в eval/blind.yaml (не коммитьте его до прогона, отдайте файлом).
#   2. Откройте документы из data/raw (PDF и DOCX) и пишите вопросы так, как спросил бы
#      сотрудник цеха: своими словами, можно с опечатками и разговорно.
#   3. Примерно 2/3 — вопросы, ответ на которые есть в документах (type: doc);
#      1/6 — вопросы, ответа на которые в документах НЕТ, но они звучат похоже (type: none);
#      1/6 — вопросы по учётной базе: оборудование, приборы, склад, заявки (type: db).
#   4. Для type: doc укажите ключевые факты (must_include) и документ с пунктом (source).
#      id документа — имя файла без расширения; пункт — номер из документа.
#   5. Прогон: python eval/run_eval.py --questions eval/blind.yaml --out blind
#      Результат — eval/results/blind.md.
#
# Правила для must_include: короткие точные фрагменты («15 календарных дней», «2211»);
# варианты через «|» («1 раз|один раз»). Регистр и «ё/е» не важны.

questions:
  - id: B01
    group: слепой
    type: doc
    question: Сколько дней даётся на входной контроль покупных комплектующих?
    must_include: ["3 рабочих дн"]
    source: {doc: STP-DP-01_vkhodnoj_kontrol, clause: "3.2"}

  - id: B02
    group: слепой
    type: none
    question: Сколько раз в год проводится инвентаризация склада ЭРИ?

  - id: B03
    group: слепой
    type: db
    question: Какие средства измерений сейчас находятся в поверке?
    must_include: ["СИ-0020"]
