# Ответ на дату (kbagent/asof.py): вопрос с прошедшей датой — ответ по редакции, действовавшей тогда, с примечанием,
# что действует сейчас. В демо-базе СТП ДП-02-2024 действовал с 15.01.2024 по 28.02.2026, с 01.03.2026 — СТП ДП-02-2026:
# в старой редакции телефон 2200 (мастеру), заявка — 2 часа, аварийный ремонт — 30 минут, «табличка «Не включать»»;
# в новой — 2211 (диспетчеру), 30 минут, категория А — 15 минут, плакат. Ответ составляет модель — прогон на
# компьютере с моделями:
#   python eval/run_eval.py --questions eval/asof.yaml --out asof
# Отбор редакций (что попадает в поиск) проверяется без модели — tests/test_eval_sets.py.
questions:
  - id: A01
    group: на дату
    type: doc
    question: По какому телефону сообщали об отказе оборудования, угрожающем жизни, на 01.06.2025?
    must_include: ["2200", "СТП ДП-02-2024"]
    must_exclude: ["2211"]
    source: {doc: STP-DP-02-2024_otkaz_oborudovaniya, clause: "2.1"}
  - id: A02
    group: на дату
    type: doc
    question: За какое время мастер оформлял заявку на ремонт после отказа оборудования в 2024 году?
    must_include: ["2 час"]
    must_exclude: ["30 минут"]
    source: {doc: STP-DP-02-2024_otkaz_oborudovaniya, clause: "3.1"}
  - id: A03
    group: на дату
    type: doc
    question: Как быстро ремонтная служба приступала к работам по аварийным отказам в марте 2025 года?
    must_include: ["30 минут"]
    must_exclude: ["15 минут"]
    source: {doc: STP-DP-02-2024_otkaz_oborudovaniya, clause: "4.1"}
  - id: A04
    group: на дату
    type: doc
    question: Что вывешивали на органах управления неисправного оборудования на 15.12.2025?
    must_include: ["Не включать"]
    must_exclude: ["плакат"]
    source: {doc: STP-DP-02-2024_otkaz_oborudovaniya, clause: "2.2"}
  - id: A05
    group: на дату, та же редакция
    type: doc
    question: Какой срок входного контроля ЭРИ действовал на 01.06.2026?
    must_include: ["5 рабочих дней", "те же редакции"]
    source: {doc: STP-DP-01_vkhodnoj_kontrol, clause: "3.2"}
  - id: A06
    group: на дату, документа ещё не было
    type: none
    question: Какой срок входного контроля ЭРИ действовал на 01.06.2023?
    must_exclude: ["5 рабочих дней"]
    note: СТП ДП-01 действует с 01.03.2026 — на эту дату его не было, правильно — честный отказ
  - id: A07
    group: без даты — действующая редакция
    type: doc
    question: Как быстро ремонтная служба приступает к работам по отказу категории А?
    must_include: ["15 минут"]
    must_exclude: ["30 минут"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya}
