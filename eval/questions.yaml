    group: новый
    type: none
    question: Как часто стирают спецодежду работникам участка пайки?

  # ===== Расширение: учётная база =====
  - id: D06
    group: новый
    type: db
    question: Когда очередная поверка мультиметра СИ-0011?
    must_include: ["date:2026-11-12"]
  - id: D07
    group: новый
    type: db
    question: Какое оборудование законсервировано?
    must_include: ["ОБ-0302|Вибростенд"]
  - id: D08
    group: новый
    type: db
    question: Кто подавал заявку на ремонт ванны ультразвуковой отмывки?
    must_include: ["Захаров"]

  # ===== Ловушки: найдены при критическом разборе 03.10.2026 (вопросов нет в подсказках модели) =====
  - id: L01
    group: ловушки
    type: doc
    question: Что делать работнику, если оборудование искрит?
    must_include: ["аварийн", "2211", "вскрыва"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya, clause: "3.1"}
    note: полнота — запрет самостоятельно вскрывать оборудование (п. 3.3) должен быть в ответе
  - id: L02
    group: ловушки
    type: doc
    question: Почему наряд-допуск можно продлевать сколько угодно раз?
    must_include: ["1 раз|один раз|однократно"]
    source: {doc: ot_electro_903n, clause: "6.3"}
    note: неверная посылка — агент должен поправить, а не отказать
  - id: L03
    group: ловушки
    type: doc
    history: ["Что делать при отказе оборудования?"]
    question: А если это случилось ночью?
    must_include: ["2215"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya, clause: "7.2"}
    note: уточнение в диалоге
  - id: L04
    group: ловушки
    type: none
    history: ["Что делать при искрении оборудования?"]
    question: А сколько стоит обед?
    note: посторонний вопрос в диалоге — отказ
  - id: L05
    group: ловушки
    type: clarify
    question: Какой срок?
  - id: L06
    group: ловушки
    type: doc
    question: По какому телефону сообщить дежурному диспетчеру об отказе оборудования?
    must_include: ["2211"]
    must_exclude: ["2200"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya, clause: "3.1"}
    note: в базе знаний есть отменённая редакция 2024 года с телефоном 2200
  - id: L07
    group: ловушки
    type: both
    question: Можно ли выдать в производство конденсаторы ЭРИ-1003?
    must_include: ["карантин", "входн"]
    source: {doc: [STP-DP-01_vkhodnoj_kontrol, RI-DP-03_khranenie_eri]}
  - id: L08
    group: ловушки
    type: both
    question: У мультиметра СИ-0012 истёк срок поверки — можно ли им пользоваться?
    must_include: ["Осциллограф", "запрещ|не допускается|нельзя"]
    source: {doc: RI-DP-04_sredstva_izmerenij, clause: "4.1"}
    note: неверная посылка в базе — СИ-0012 записан как осциллограф
  - id: L09
    group: ловушки
    type: none
    question: Какая столица Франции?
  - id: L10
    group: ловушки
    type: both
    question: Ванна ОБ-0202 в ремонте — кто подписывает акт о вводе в эксплуатацию после ремонта?
    must_include: ["в ремонте", "ремонтной службы", "мастер"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya, clause: "6.2"}

  # ===== Ловушки-2: разбор «до профессионального уровня», 03.10.2026 (вопросов нет в подсказках модели) =====
  - id: M01
    group: ловушки-2
    type: doc
    question: Что делать при отказе категории Б?
    must_include: ["30 минут", "1 час"]
    must_exclude: ["2211"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya}
