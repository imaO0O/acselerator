    question: О чём ГОСТ Р 2.105-2019?
    must_include: ["текстов"]
    source: {doc: gost_r_2_105_2019}
  - id: M06
    group: ловушки-2
    type: doc
    history: ["Что делать при отказе категории Б?", "А в какой срок приступит ремонтная служба?"]
    question: А если это ночная смена?
    must_include: ["1 час|начальник смены|2215"]
    source: {doc: STP-DP-02_otkaz_oborudovaniya}
