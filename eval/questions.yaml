    must_exclude: ["1 день"]
    source: {doc: STP-DP-01_vkhodnoj_kontrol, clause: "3.2"}
  - id: M08
    group: ловушки-2
    type: none
    question: Какой штраф для работника за нарушение порядка входного контроля?
  - id: M09
    group: ловушки-2
    type: db
    question: Где лежит флюс?
    must_include: ["Шкаф ЛВЖ"]
  - id: M10
    group: ловушки-2
    type: db
    question: За какое оборудование отвечает Белов?
    must_include: ["ОБ-0201", "ОБ-0202", "ОБ-0203"]
  - id: M11
    group: ловушки-2
    type: db
    question: Сколько осталось припоя ПОС-40?
    must_include: ["ПОС-61"]
    note: такого припоя нет — агент должен сказать об этом и показать похожий
  - id: M12
    group: ловушки-2
    type: db
    question: Какие средства измерений нужно поверить в ближайшие 90 дней?
    must_include: ["СИ-0011", "СИ-0014", "СИ-0015", "СИ-0020"]
