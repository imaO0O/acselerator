# Словарь предприятия: как одно и то же называют сотрудники и документы.
# Используется для расширения запроса, когда спрашивают о документах по теме
# («какие документы есть по метрологии?» → средства измерений, поверка, калибровка).
# Дополняется вместе с сотрудниками партнёра.

terms:
  метрология: [средства измерений, поверка, калибровка, метролог]
  поверка: [средства измерений, поверочный знак, метролог]
  эри: [электрорадиоизделия, комплектующие]
  комплектующие: [электрорадиоизделия, покупные изделия]
  охрана труда: [безопасность, правила по охране труда, наряд-допуск]
  электробезопасность: [электроустановки, наряд-допуск, охрана труда]
  пайка: [паяльная станция, паяльник, жало, припой]
  ремонт: [отказ оборудования, заявка на ремонт, ремонтная служба]
  входной контроль: [бвк, карантин, акт о несоответствии]
  оформление документов: [реквизиты, поля документа, гост р 7.0.97]
  измерительные приборы: [мультиметр, осциллограф, средства измерений]
