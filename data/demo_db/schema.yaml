# Слой понятных названий учётной базы.
#
# Модель не видит данных — только это описание. По нему она составляет SQL-запрос,
# поэтому здесь записано, что хранится в каждой таблице и поле человеческим языком,
# с примерами значений. Для реальной 1С или ERP описание составляется один раз
# (черновик — scripts/describe_db.py) и правится вместе с ответственным за систему:
# служебные имена вида _Document123 заменяются понятными, лишние таблицы не включаются.
#
#   name      — имя таблицы в базе
#   title     — что в ней хранится
#   synonyms  — как сотрудники называют эти данные в вопросах (необязательно)
#   keys      — поля-номера, по которым на запись ссылаются в вопросах («СИ-0012», «П-2609-04»)
#   columns   — поле: описание для модели (с примерами значений в кавычках)
#   labels    — короткие подписи полей для показа записи сотруднику (если описание
#               начинается не с названия поля); модель их не видит
#
# Описание читает небольшая языковая модель, и она чувствительна к формулировкам:
# после любой правки прогоняйте вопросы к базе из эталона (python eval/run_eval.py).

tables:
  - name: equipment
    title: технологическое оборудование
    keys: [inv_no]
    columns:
      inv_no: инвентарный номер (например, 'ОБ-0102')
      name: наименование
      kind: вид (технологическое, контрольное, испытательное, вспомогательное)
      location: участок
      status: состояние ('в работе', 'в ремонте', 'законсервировано')
      responsible: ответственный (ФИО)

  - name: measuring_instruments
    title: средства измерений (СИ)
    keys: [inv_no]
    columns:
      inv_no: инвентарный номер (например, 'СИ-0012')
      name: наименование
      model: модель
      serial_no: заводской номер
      location: где находится
      last_check: дата последней поверки или калибровки (ГГГГ-ММ-ДД)
      next_check: дата очередной поверки или калибровки (ГГГГ-ММ-ДД)
      check_type: "'поверка' или 'калибровка'"
      status: "'в эксплуатации', 'в поверке', 'не поверен'"
    labels: {check_type: вид работ, status: состояние}
    # срок, по которому отвечают на «у каких СИ истёк срок поверки» — запросом по дате, без языковой модели
    due: {column: next_check, words: "поверк|калибровк"}

  - name: repair_requests
    title: заявки на ремонт оборудования
    keys: [inv_no]
    columns:
      id: номер заявки
      inv_no: инвентарный номер оборудования (связь с equipment.inv_no)
      created_at: дата и время подачи (ГГГГ-ММ-ДД ЧЧ:ММ)
      category: категория отказа ('А' — угроза жизни и здоровью, 'Б' — остановка участка, 'В' — частичная потеря функций)
      description: описание неисправности
      status: "'новая', 'в работе', 'выполнена' (открытые заявки — 'новая' и 'в работе')"
      applicant: заявитель
    labels: {status: статус заявки}

  - name: stock
    title: остатки на складе
    keys: [part_no, batch]
    columns:
      part_no: номенклатурный номер
      name: наименование
      kind: "'ЭРИ', 'комплектующие', 'материалы'"
      qty: количество
      unit: единица
      batch: номер партии
      received: дата поступления
      inspection_status: статус входного контроля ('годен', 'карантин', 'брак')
      location: место хранения
    labels: {kind: вид}
